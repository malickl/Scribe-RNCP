[flake8]
max-line-length = 120
exclude = venv,.venv,__pycache__,.git,.pytest_cache,scripts

[tool:pytest]
addopts = -m "not latency"
markers =
    latency: appelle les vraies API (Groq, AssemblyAI, Recall) pour mesurer une latence réelle ; jamais exécuté par défaut (pytest -m latency pour les lancer explicitement)
